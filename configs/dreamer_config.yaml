# Configuration for Dreamer (world model)
algorithm:
  type: dreamer

agent:
  latent_dim: 64
  hidden_dim: 256
  rnn_hidden_dim: 256
  lr: 0.0003
  gamma: 0.99
  lambda_: 0.95
  imagination_horizon: 15
  seq_len: 50

training:
  total_steps: 500000  # Shorter due to sample efficiency
  batch_size: 16
  buffer_size: 100000
  max_episode_steps: 1000
  checkpoint_interval: 25000
  eval_interval: 10000
  eval_episodes: 10
  update_every: 10

env:
  domain_randomization:
    randomize_mass: false  # Start simple for world model
    randomize_friction: false
    randomize_damping: false

logging:
  log_interval: 100

paths:
  log_dir: results/dreamer/logs
  checkpoint_dir: results/dreamer/checkpoints
  video_dir: results/dreamer/videos

device: cuda
seed: 42
