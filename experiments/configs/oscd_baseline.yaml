# Example configuration for OSCD dataset training
# Baseline model with GMM density model

experiment:
  name: "oscd_baseline_gmm"
  seed: 42
  output_dir: "experiments/runs"

model:
  backbone: "resnet18"           # resnet18 or resnet34
  embedding_dim: 128             # 64 or 128
  density_model: "gmm"           # gmm, normalizing_flow, or null
  n_gmm_components: 3
  n_flows: 6
  pretrained: true
  input_channels: 3

ensemble:
  enabled: false
  n_models: 3

dataset:
  name: "oscd"                   # oscd or levir_cd
  root_dir: "data/OSCD"
  patch_size: 256
  use_rgb_only: true
  normalize: true
  
  # Train/val/test splits (region-wise)
  train_regions:
    - "abudhabi"
    - "aguasclaras"
    - "beihai"
  val_regions:
    - "beirut"
  test_regions:
    - "bercy"

training:
  batch_size: 16
  epochs: 100
  num_workers: 4
  
  optimizer:
    type: "adamw"
    lr: 0.0001
    weight_decay: 0.01
  
  scheduler:
    type: "cosine"              # cosine, step, or plateau
    min_lr: 0.000001
    warmup_epochs: 5
  
  loss:
    type: "combined"            # bce, dice, combined, or focal
    bce_weight: 0.5
    dice_weight: 0.5
    pos_weight: 2.0             # Weight for positive class
  
  mixed_precision: true
  gradient_clip: 1.0
  
  checkpoint:
    save_freq: 10               # Save every N epochs
    save_best: true

density_model_training:
  enabled: true
  fit_on_train: true
  min_samples: 100              # Minimum change samples needed

thresholds:
  no_change: 0.5
  change_confident: 0.7
  log_likelihood: -10.0
  uncertainty: 0.3

evaluation:
  metrics:
    - "precision"
    - "recall"
    - "f1"
    - "iou"
    - "auroc"
    - "ece"
  
  compute_ood: true
  compute_calibration: true
  save_visualizations: true
  
  visualization:
    num_samples: 10
    save_dir: "visualizations"
